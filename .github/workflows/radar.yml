name: Radar Twitch

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interroger Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GAME_NAMES: ${{ vars.GAME_NAMES || 'Grand Theft Auto VI,Grand Theft Auto 6' }}
          RADAR_LANG: ${{ vars.RADAR_LANG || 'fr' }}
        run: python scripts/radar.py
      - name: Publier les données
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data/radar.json
          git diff --cached --quiet || git commit -m "radar: mise à jour des données"
          git push
