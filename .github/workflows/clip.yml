name: Fabriquer des clips

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien(s) du clip ou de la VOD (Twitch, Kick, Drive...). Écris test pour une vidéo de démonstration"
        required: true
        default: "test"
      titre:
        description: "Titre d'accroche (6 mots max). Vide = pas de titre"
        required: false
        default: ""
      debut:
        description: "Début (ex. 1:02:30). Vide = clip entier"
        required: false
        default: ""
      fin:
        description: "Fin (ex. 1:03:15). Vide = début + 60 s"
        required: false
        default: ""
      auto:
        description: "Nombre de temps forts à trouver tout seul (0 = désactivé)"
        required: false
        default: "0"
      montage:
        description: "oui = réunir les temps forts dans UN seul clip avec fondus"
        type: choice
        options: [non, oui]
        default: non
      mise_en_page:
        description: "flou = fond flouté · zoom = plein écran · cam-xx = facecam en haut (coin hg, hd, bg, bd)"
        type: choice
        options: [flou, zoom, cam-hg, cam-hd, cam-bg, cam-bd]
        default: flou
      style:
        description: "dynamique = zooms, mot surligné, barre · simple = sous-titres sobres · brut = aucun texte auto"
        type: choice
        options: [dynamique, simple, brut]
        default: dynamique
      mention:
        description: "Mention pub affichée 4 s (ex. Partenariat rémunéré). Vide = aucune"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          pip install -q -r requirements.txt
      - name: Cache du modèle de sous-titres
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Fabrication
        env:
          IN_URL: ${{ inputs.url }}
          IN_TITRE: ${{ inputs.titre }}
          IN_DEBUT: ${{ inputs.debut }}
          IN_FIN: ${{ inputs.fin }}
          IN_AUTO: ${{ inputs.auto }}
          IN_MONTAGE: ${{ inputs.montage }}
          IN_LAYOUT: ${{ inputs.mise_en_page }}
          IN_STYLE: ${{ inputs.style }}
          IN_MENTION: ${{ inputs.mention }}
        run: |
          python scripts/make_clip.py \
            --url "$IN_URL" --title "$IN_TITRE" --start "$IN_DEBUT" --end "$IN_FIN" \
            --auto "${IN_AUTO:-0}" --montage "${IN_MONTAGE:-non}" --layout "${IN_LAYOUT:-flou}" \
            --style "${IN_STYLE:-dynamique}" --mention "$IN_MENTION" --out out
      - name: Clips à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: out/
          retention-days: 7
      - name: Publier sur le site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish.py --clips out
